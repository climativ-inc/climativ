# Configuration Netlify pour le site Climativ (site statique, aucune compilation)
# Tous les fichiers du site sont à la racine du dépôt.
[build]
  publish = "."

# Sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
